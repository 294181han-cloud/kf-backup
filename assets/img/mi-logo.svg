<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 小米客服 logo：橙色圆角方块 + 白色 mi
       m 的关键是「左边一块宽的实心块 + 一条很窄的缝 + 细腿」——
       左块画细了就会读成 n（v2.65 第一版就是这个问题，已按参考图重画）。
       m：外轮廓按 左20→上30→右52→圆角半径14到(66,44)→下70 → 底部开一条 46~58 的窄缝到 y=46
       i：70~78 的竖条 -->
  <rect x="0" y="0" width="100" height="100" rx="28" ry="28" fill="#FF6900"/>
  <path d="M20 70 V30 H52 A14 14 0 0 1 66 44 V70 H58 V46 H46 V70 Z" fill="#ffffff"/>
  <rect x="70" y="30" width="8" height="40" fill="#ffffff"/>
</svg>
