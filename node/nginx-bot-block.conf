# =====================================================================
# v2.71 反爬：爬虫/扫描器 UA → 空白页（HTTP 200 空文档，不跳转、不断连接）
#
# 用法：把本文件放进 /www/server/panel/vhost/nginx/，然后在落地域名的
#       server{ } 里加一行 include：
#         include /www/server/panel/vhost/nginx/nginx-bot-block.conf;
#       （或用仓库里的 bin/add_bot_block.py 自动注入，幂等、带备份）
#
# 目的：微信/安全厂商的自动预检（爬虫不执行 JS）拿到的只是一张白纸，
#       所以"内容审核"这一关抓不到东西 —— 只有真人主动举报才会把域名搞红。
# 注意：真人浏览器 UA 不受影响；这里只挡明确的机器人/扫描器/自动化框架。
# =====================================================================
default_type text/html;
set $kf_ua $http_user_agent;
if ($kf_ua ~* "(bot|spider|crawler|slurp|curl|wget|python|java/|go-http|okhttp|headless|phantom|selenium|puppeteer|playwright|scrapy|httpclient|libwww|httrack|winhttp|aria2|axios|node-fetch|postman|zgrab|masscan|nmap|nuclei|sqlmap|facebookexternalhit|bytespider|baiduspider|sogou|360spider|yisou|applebot|petalbot|semrush|ahrefs|censys|shodan|telegrambot|whatsapp)") {
    return 200 "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>id-0000</title></head><body></body></html>";
}
if ($kf_ua = "") {
    return 200 "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>id-0000</title></head><body></body></html>";
}
