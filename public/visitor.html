<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1677ff">
<title>在线咨询</title>
<link rel="icon" href="/assets/img/mi-logo.png">
<link rel="apple-touch-icon" href="/assets/img/mi-logo.png">
<link rel="stylesheet" href="/assets/css/visitor.css?v=2.16.0">
</head>
<body>
<!-- v2.52 兜底：脚本没跑起来时（微信旧内核 document.write 不执行脚本 / 资源被缓存污染 / 网络抽风），
     不要把那堆 {{ }} 模板原文露给访客看 -->
<style>[v-cloak]{display:none!important}</style>
<div id="boot-tip">正在接入…</div>
<div id="app" v-cloak>
  <!-- 不可用 / 加载 -->
  <template v-if="page === 'blocked'">
    <div class="block-page">
      <div class="block-card">
        <div class="block-icon">⚠️</div>
        <div class="block-title">{{ blockedTitle }}</div>
        <div class="block-desc">{{ blockedDesc }}</div>
      </div>
    </div>
  </template>
  <template v-else-if="page === 'loading'">
    <div class="block-page">
      <div class="block-card">
        <div class="spinner"></div>
        <div class="block-title">正在接入</div>
        <div class="block-desc">正在为您连接客服，请稍候…</div>
      </div>
    </div>
  </template>

  <!-- 主界面 -->
  <template v-else>
    <div class="nav-bar" v-if="ui.navOn"><span class="nav-back">‹</span><span class="nav-title">{{ ui.navTitle }}</span><span class="nav-menu">···</span></div>
    <div class="v-header">
      <div class="v-avatar">
        <img v-if="isImg(brand.avatar)" :src="brand.avatar"><template v-else>{{ brand.avatar }}</template>
        <span class="online-dot"></span>
      </div>
      <div class="v-id">
        <div class="v-title" v-if="brand.show_nickname">{{ brand.company_name }}<span v-if="brand.vip_badge" class="vip-badge">{{ brand.vip_badge }}</span></div>
        <div class="v-sub" v-if="brand.show_support">{{ brand.welcome_sub }}</div>
      </div>
      <div class="v-status"><i class="st-dot"></i>{{ onlineText }}</div>
      <!-- v2.60.9 换手机/换浏览器后接回原对话 -->
      <button type="button" class="v-resume-btn" title="换设备后恢复原对话" @click="openResume">恢复对话</button>
    </div>

    <!-- v2.60.9 恢复原对话弹窗 -->
    <div class="v-modal" v-if="resumeOpen">
      <div class="v-modal-card">
        <div class="vm-t">恢复原对话</div>
        <div class="vm-d">输入客服给你的恢复码，就能回到换设备前的那段对话。</div>
        <input class="vm-in" v-model="resumeCode" maxlength="16" placeholder="请输入恢复码" @keyup.enter="doResume">
        <div class="vm-err" v-if="resumeErr">{{ resumeErr }}</div>
        <div class="vm-ops">
          <button type="button" class="vm-btn ghost" @click="resumeOpen = false">取消</button>
          <button type="button" class="vm-btn" :disabled="resumeBusy" @click="doResume">{{ resumeBusy ? '恢复中…' : '恢复原对话' }}</button>
        </div>
        <div class="vm-tip">恢复码和续聊链接都能进入当前对话，请不要发给无关人员。</div>
      </div>
    </div>

    <!-- 滚动通知 -->
    <div class="inform-bar" v-if="brand.inform_on && brand.inform_text">
      <span class="inform-track">📢 {{ brand.inform_text }}</span>
    </div>

    <!-- 公告横幅 -->
    <div class="notice-bar" v-if="brand.notice_on && brand.notice_text">
      <span class="n-ic">📢</span><span>{{ brand.notice_text }}</span>
    </div>

    <div class="v-body" ref="bodyRef" @scroll.passive="onBodyScroll">
      <!-- 欢迎屏（暂无消息） -->
      <div class="welcome-card" v-if="!messages.length">
        <div class="w-ava"><img v-if="isImg(brand.avatar)" :src="brand.avatar"><template v-else>{{ brand.avatar }}</template></div>
        <h3>{{ brand.welcome_title }}</h3>
        <p>{{ brand.welcome_sub }}</p>
        <div class="w-chips">
          <button class="w-chip" v-for="c in SUGGEST" :key="c" @click="suggest(c)">{{ c }}</button>
        </div>
        <div class="w-tip"><i></i>客服通常 1 分钟内回复，请放心咨询</div>
      </div>

      <template v-for="(m, mi) in visibleMessages" :key="m.id">
      <div class="day-sep" v-if="needDaySep(mi)"><span>{{ dayText(m.time) }}</span></div>
      <div class="msg-row" :id="'vm' + m.id" :class="[m.from === 'visitor' ? 'visitor' : 'agent', {flash: flashId === m.id}]">
        <template v-if="m.recalled">
          <div class="msg-bubble recall-capsule">{{ m.from === 'visitor' ? '你撤回了一条消息' : '对方撤回了一条消息' }}</div>
        </template>
        <template v-else>
          <div class="msg-ava" v-if="m.from === 'visitor'">{{ myAvatar || '🙋' }}</div>
          <div class="msg-ava" v-else>
            <img v-if="isImg(agentAvatar || brand.avatar)" :src="agentAvatar || brand.avatar"><template v-else>{{ agentAvatar || brand.avatar }}</template>
          </div>
          <div class="msg-box">
            <div class="msg-bubble ask-card" v-if="m.msg_type === 'ask_image'">
              <div class="ac-ic">🖼️</div>
              <div class="ac-t">客服请求您上传图片</div>
              <div class="ac-s">{{ m.text }}</div>
              <span class="v-file-wrap">
                <button class="ac-btn" @click="pickImage">上传图片</button>
                <input class="v-file-ghost" type="file" accept="image/*" multiple @change="onImage">
              </span>
            </div>
            <div class="msg-bubble" v-else>
              <!-- 引用回复：显示被引用的那条（点一下跳到原消息） -->
              <div class="msg-quote" v-if="m.reply_to && quoteOf(m)" @click.stop="jumpTo(m.reply_to)">
                <span class="mq-who">{{ quoteWho(quoteOf(m)) }}</span>
                <span class="mq-text">{{ quoteText(quoteOf(m)) }}</span>
              </div>
              <!-- v2.73 多图并排 + 文字在下面（跟 Telegram 一样） -->
              <div class="msg-imgs" v-if="imgsOf(m).length" :class="'n' + Math.min(imgsOf(m).length, 4)">
                <img v-for="(a, ii) in imgsOf(m)" :key="'i'+ii" :src="a.url" @click="viewImage(a.url)">
              </div>
              <template v-if="m.text"><template v-for="(seg, si) in linkSegs(m.text)" :key="si"><a v-if="seg.isUrl && linkMode === 'jump'" class="msg-link" :href="seg.t" target="_blank" rel="noopener noreferrer">{{ seg.t }}</a><span v-else-if="seg.isUrl && linkMode === 'copy'" class="msg-link-copy" @click="copyLink(seg.t)">🔗 复制链接</span><template v-else>{{ seg.t }}</template></template></template>
              <span class="msg-edited" v-if="m.edited">已编辑</span>
              <template v-for="(a, i) in (m.attachments || [])" :key="i">
                <video v-if="a.type === 'video'" class="vb-video" :src="a.url" controls preload="metadata"></video>
                <a v-if="a.type === 'file'" class="file-bubble" :href="a.url" target="_blank" rel="noopener" download>
                  <span class="fb-ic">📄</span>
                  <span class="fb-body"><span class="fb-name">{{ a.name || '文件' }}</span><span class="fb-size">{{ fmtSize(a.size) }}</span></span>
                  <span class="fb-dl">↓</span>
                </a>
                <a v-if="a.type === 'location'" class="loc-bubble" :href="mapUrl(a)" target="_blank" rel="noopener">
                  <span class="lb-ic">📍</span>
                  <span class="lb-body"><span class="lb-name">{{ a.name || '位置' }}</span><span class="lb-sub">点击在地图中查看</span></span>
                </a>
                <div v-if="a.type === 'audio'" class="voice-bubble" :class="{playing: audioPlaying===a.url}" @click.stop="toggleAudio(a.url)">
                  <span class="vb-play">
                    <svg v-if="audioPlaying!==a.url" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
                    <svg v-else viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5.5" width="3.4" height="13" rx="1.2"/><rect x="13.6" y="5.5" width="3.4" height="13" rx="1.2"/></svg>
                  </span>
                  <span class="vb-wave"><i v-for="(h, wi) in waveBars(a.url)" :key="wi" :style="{height: h + 'px'}"></i></span>
                  <span class="vb-sec">{{ audioDur[a.url] ? audioDur[a.url] + '″' : '' }}</span>
                </div>
              </template>
              <span class="b-time">{{ fmtTime(m.time) }}<i v-if="m.from === 'visitor' && m.read" class="b-tick">✓✓</i></span>
            </div>
            <div class="msg-time" v-if="m.from === 'visitor' && canRecall(m)">
              <a class="recall-link" @click="recallMine(m)">撤回</a>
            </div>
            <!-- v2.60.20 每条消息右下角给个 ⋯：点一下出「回复 / 复制文字 / 撤回」，
                 不用再长按（长按在部分手机上会触发浏览器的全选/拷贝，很难用） -->
            <div class="msg-time">
              <button type="button" class="msg-more" title="回复 / 复制" @click.stop="openActSheet(m)">⋯</button>
            </div>
          </div>
        </template>
      </div>
      </template>
    </div>

    <!-- 会话已结束（客服结束会话后，聊天记录按提示清除） -->
    <div class="ended-wrap" v-if="ended">
      <div class="ended-card">
        <div class="e-ic">✅</div>
        <div class="e-t">本次会话已结束</div>
        <div class="e-s">聊天记录已清除。如需继续咨询，可重新发起会话。</div>
        <button class="e-btn" @click="restartChat">重新咨询</button>
      </div>
    </div>

    <!-- 按住说话的提示层 -->
    <div class="hold-tip" v-if="holding" :class="{cancel: holdCancel}">
      <div class="ht-wave"><i v-for="n in 7" :key="n"></i></div>
      <div class="ht-time">{{ holdSecs }}″</div>
      <div class="ht-t">{{ holdCancel ? '松开手指，取消发送' : '手指上滑，取消发送' }}</div>
    </div>

    <button class="v-tobottom" v-if="!ended && !atBottom" @click="scrollBottomNow" title="回到最新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    </button>

    <!-- 长按消息 / 右键：回复、复制、撤回 -->
    <div class="v-sheet-mask" v-if="actSheet.show" @click="actSheet.show = false"></div>
    <div class="v-sheet" v-if="actSheet.show">
      <button class="vs-item" @click="startReply(actSheet.msg)">💬 回复</button>
      <button class="vs-item" @click="copyMsg(actSheet.msg)">📋 复制文字</button>
      <button class="vs-item danger" v-if="actSheet.msg && actSheet.msg.from === 'visitor' && canRecall(actSheet.msg)" @click="recallMine(actSheet.msg)">↩️ 撤回</button>
      <button class="vs-item ghost" @click="actSheet.show = false">取消</button>
    </div>

    <template v-if="!ended">
    <div class="v-footer-wrap">
      <!-- 引用回复：正在回复谁 -->
      <div class="v-reply-bar" v-if="replyTo">
        <div class="vr-body">
          <span class="vr-who">回复 {{ quoteWho(replyTo) }}</span>
          <span class="vr-text">{{ quoteText(replyTo) }}</span>
        </div>
        <button class="vr-x" @click="replyTo = null" title="取消回复">✕</button>
      </div>
      <!-- 待发附件：粘贴/选图先放这里，可以配文字、多张一起发 -->
      <div class="v-pending" v-if="pendingAtts.length">
        <div class="vp-item" v-for="(a, i) in pendingAtts" :key="i">
          <img v-if="!a.type || a.type === 'image'" :src="a.url">
          <span v-else class="vp-file">{{ a.type === 'video' ? '🎬' : '📄' }}</span>
          <span class="vp-rm" @click="rmPending(i)">✕</span>
        </div>
        <span class="vp-tip">{{ pendingAtts.length }} 张待发送</span>
      </div>
      <div class="v-bar" v-if="!voiceMode">
        <button class="v-icon-btn" @click="toggleVoice" title="切换成按住说话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
        </button>
        <!-- v2.72 手机浏览器必须"原生点击"：把隐藏的 file 框做成按钮上的一层透明覆盖，
             手指直接点在 input 上，iOS Safari / 安卓浏览器才会打开相册
             （原来 display:none + JS .click() 只有微信内核认，手机浏览器不认） -->
        <span class="v-file-wrap">
          <button class="v-icon-btn" @click="pickImage" title="发送图片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16.5 16.5 12l-6 6"/></svg>
          </button>
          <input class="v-file-ghost" ref="imgInput" type="file" accept="image/*" multiple @change="onImage">
        </span>
        <textarea class="v-input" ref="inputRef" rows="1" v-model="draft"
          @focus="scrollBottom" placeholder="请输入您的问题…" @input="onDraftInput"
          @paste="onPaste" @keydown="onInputKey"></textarea>
        <button class="v-btn" :class="{ready: !!draft.trim() || pendingAtts.length}" :disabled="(!draft.trim() && !pendingAtts.length) || sending" @click="send" title="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6.5 8L20 20z"/></svg>
        </button>
      </div>
      <div class="v-bar" v-else>
        <button class="v-icon-btn" @click="toggleVoice" title="切换键盘">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M7 10.5h.01M11 10.5h.01M15 10.5h.01M17 13.8h.01M7 13.8h.01M11 13.8h6"/></svg>
        </button>
        <button class="v-hold-btn" :class="{on: holding && !holdCancel, cancel: holding && holdCancel}"
          @pointerdown.prevent="startHold" @pointermove.prevent="moveHold"
          @pointerup.prevent="endHold" @pointercancel.prevent="endHold" @contextmenu.prevent>
          {{ holding ? (holdCancel ? '松开取消' : '松开发送 ' + holdSecs + '″') : '按住 说话' }}
        </button>
      </div>
    </div>
    <div class="v-footer-text" v-if="brand.footer_text">{{ brand.footer_text }}</div>
    </template>

  </template>

  <!-- 验证层 -->
  <template v-if="page === 'verify'">
    <div class="verify-wrap">
      <div class="verify-card" :class="{bg: verifyBg}" :style="verifyBg ? {backgroundImage:'url('+verifyBg+')'} : {}">
        <div class="verify-inner">
          <div class="verify-title">{{ verifyTitle }}</div>
          <template v-if="robotType === 'click'">
            <button class="verify-btn" v-if="!verifyPassed" @click="verifyPassed = true">点击验证</button>
            <div class="slide-ok" v-else>✓ 验证通过，正在进入…</div>
          </template>
          <template v-else-if="robotType === 'slide'">
            <div class="slide-track" v-if="!verifyPassed">
              <div class="slide-tip">按住滑块拖到最右侧</div>
              <div class="slide-block" style="touch-action:none;" @pointerdown="slideStart" @pointermove="slideMove" @pointerup="slideEnd">»</div>
            </div>
            <div class="slide-ok" v-else>✓ 验证通过，正在进入…</div>
          </template>
          <template v-else-if="robotType === 'code'">
            <div class="verify-code-row">
              <span class="verify-code-img">{{ codeText }}</span>
              <span style="cursor:pointer;font-size:16px;" @click="genCode">↻</span>
            </div>
            <input class="verify-input" v-model="codeInput" placeholder="输入图中字符" maxlength="4">
            <button class="verify-btn" @click="codeVerify">验证</button>
          </template>
          <template v-else>
            <input class="verify-input" v-model="verifyValue" :placeholder="robotType === 'invite' ? '请输入邀请码' : '请输入访问密码'" type="password">
            <button class="verify-btn" @click="verifyGo">进入</button>
          </template>
          <div v-if="verifyErr" style="color:#f53f3f;font-size:12.5px;margin-top:10px;">{{ verifyErr }}</div>
        </div>
      </div>
    </div>
  </template>

  <!-- 弹窗公告 -->
  <div class="pub-mask" v-if="pubShow">
    <div class="pub-card">
      <div class="pub-head"><span>{{ pubTitle }}</span><span class="pub-close" @click="pubShow = false">✕</span></div>
      <div class="pub-body">{{ pubContent }}</div>
      <div style="padding:0 18px 18px;"><button class="verify-btn" @click="pubShow = false">我知道了</button></div>
    </div>
  </div>

  <!-- 询前表单 -->
  <div class="mask" v-if="showForm">
    <div class="form-card">
      <div class="form-ava"><img v-if="isImg(brand.avatar)" :src="brand.avatar"><template v-else>{{ brand.avatar }}</template></div>
      <div class="form-title">{{ brand.welcome_title }}</div>
      <div class="form-sub">{{ brand.company_name }} · 在线客服</div>
      <div class="form-item" v-for="f in formItems" :key="f.id">
        <label class="form-label">{{ f.label }}<span class="req" v-if="f.required">*</span></label>
        <input v-if="f.type !== 'textarea'" class="form-input" v-model="formValues[f.key]" :placeholder="f.placeholder">
        <textarea v-else class="form-input" v-model="formValues[f.key]" :placeholder="f.placeholder"></textarea>
      </div>
      <button class="form-btn" :disabled="formSubmitting" @click="submitForm">{{ formSubmitting ? '正在接入…' : '开始咨询' }}</button>
    </div>
  </div>

  <!-- 图片预览（v2.69：半透明底 + 文字按钮 + 左右翻图） -->
  <div class="img-viewer" v-if="viewing" @click.self="viewing = ''">
    <img :src="viewing" alt="" :style="{ transform: 'scale(' + imgZoom + ')' }" @click.stop>
    <div class="iv-tools" @click.stop>
      <span class="iv-btn" :class="{dis: viewImages.length < 2}" @click="imgGo(-1)">← 上一张</span>
      <span class="iv-btn" :class="{dis: viewImages.length < 2}" @click="imgGo(1)">下一张 →</span>
      <span class="iv-count" v-if="viewImages.length > 1">第 {{ (viewIdx < 0 ? 0 : viewIdx) + 1 }} / {{ viewImages.length }} 张</span>
      <span class="iv-sep"></span>
      <span class="iv-btn" @click="imgZoom = Math.max(0.3, imgZoom - 0.25)">缩小</span>
      <span class="iv-btn" @click="imgZoom = Math.min(6, imgZoom + 0.25)">放大</span>
      <span class="iv-btn" @click="imgZoom = 1">原始大小</span>
      <span class="iv-sep"></span>
      <span class="iv-btn close" @click="viewing = ''">关闭</span>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="v-toast" v-if="toastMsg">{{ toastMsg }}</div>
</div>

<script src="/assets/vendor/vue.global.js?v=2.0.1"></script>
<script src="/assets/js/visitor.js?v=2.26.0"></script>
<script>
/* v2.52 加载兜底：正常挂载后由 visitor.js 移除提示；8 秒还没挂载就提示"加载失败" */
(function () {
  var tip = document.getElementById('boot-tip');
  if (!tip) return;
  setTimeout(function () {
    if (window.__KF_MOUNTED__ || !tip.parentNode) return;
    tip.textContent = '加载失败，请下拉刷新重试';
  }, 8000);
})();
</script>
</body>
</html>
