<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1677ff">
<title>在线咨询</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --theme: #1677ff;
  --theme-grad: linear-gradient(135deg, #1677ff 0%, #4d9bff 100%);
  --bg: #f0f2f7;
  --card: #ffffff;
  --ink: #1a2233;
  --ink-2: #5c6b85;
  --ink-3: #9aa7bd;
  --line: #e8ecf3;
  --radius: 14px;
}
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--ink);
  display: flex; flex-direction: column;
  overflow: hidden;
}
#app { display: flex; flex-direction: column; height: 100%; }

/* ================= 头部 ================= */
.v-header {
  position: relative;
  background: var(--theme-grad);
  color: #fff;
  padding: 16px 18px calc(16px);
  display: flex; align-items: center; gap: 13px;
  flex-shrink: 0;
  z-index: 10;
}
.v-header::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: -18px; height: 18px;
  background: var(--bg);
  border-radius: 18px 18px 0 0;
}
.v-avatar {
  position: relative;
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(255,255,255,.22);
  display: flex; align-items: center; justify-content: center;
  font-size: 27px; flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(0,0,0,.14), inset 0 0 0 1.5px rgba(255,255,255,.35);
  overflow: visible;
}
.v-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.v-avatar .online-dot {
  position: absolute; right: -1px; bottom: -1px;
  width: 13px; height: 13px; border-radius: 50%;
  background: #2ee66b; border: 2.5px solid #fff0;
  box-shadow: 0 0 0 2px rgba(46,230,107,.35);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 2px rgba(46,230,107,.35);} 50% { box-shadow: 0 0 0 5px rgba(46,230,107,.12);} }
.v-title { font-size: 16.5px; font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 7px; }
.v-sub { font-size: 12px; opacity: .88; margin-top: 3px; }
.v-status {
  margin-left: auto; font-size: 11.5px; font-weight: 500;
  background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.25);
  padding: 4px 11px; border-radius: 999px; flex-shrink: 0;
  backdrop-filter: blur(4px);
}

/* ================= 平台导航条 ================= */
.nav-bar {
  background: var(--theme-grad);
  color: #fff; display: flex; align-items: center; justify-content: space-between;
  padding: calc(6px + env(safe-area-inset-top)) 14px 6px;
  font-size: 15px; font-weight: 600; flex-shrink: 0;
  opacity: .95;
}
body[data-tpl="default"] .nav-bar { display: none; }
body[data-tpl="meituan"] .nav-bar, body[data-tpl="xianyu"] .nav-bar { color: #4a3b00; }
body[data-tpl="douyin"] .nav-bar { color: #fff; }
.nav-back, .nav-menu { font-size: 17px; opacity: .85; width: 24px; text-align: center; }
.recall-capsule {
  background: rgba(26,34,51,.05) !important; color: var(--ink-3) !important;
  font-size: 11.5px !important; text-align: center; border-radius: 999px !important;
  padding: 4px 12px; box-shadow: none !important; margin: 0 auto;
}
.recall-link { color: var(--theme); margin-left: 8px; cursor: pointer; }

/* ================= 公告 ================= */
.notice-bar {
  background: linear-gradient(90deg, #fff8e8, #fffdf6);
  border-bottom: 1px solid #ffe9b8;
  color: #9a6d1b; padding: 9px 16px; font-size: 12.5px; line-height: 1.55;
  flex-shrink: 0; display: flex; gap: 7px; align-items: flex-start;
}
.notice-bar .n-ic { flex-shrink: 0; }

/* ================= 消息区 ================= */
.v-body { flex: 1; overflow-y: auto; padding: 14px 14px 6px; -webkit-overflow-scrolling: touch; }
.v-body::-webkit-scrollbar { width: 0; }

/* 欢迎屏（无消息时） */
.welcome-card {
  margin: 8vh auto 0; max-width: 300px; text-align: center;
  background: var(--card); border-radius: 20px; padding: 34px 26px;
  box-shadow: 0 10px 40px rgba(30,60,120,.08);
}
.welcome-card .w-ava {
  width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 16px;
  background: linear-gradient(135deg, rgba(22,119,255,.12), rgba(22,119,255,.22));
  display: flex; align-items: center; justify-content: center; font-size: 36px;
}
.welcome-card .w-ava img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.welcome-card h3 { font-size: 16.5px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
.welcome-card p { font-size: 13px; color: var(--ink-2); line-height: 1.7; }

.msg-row { display: flex; margin-bottom: 16px; align-items: flex-start; gap: 9px; }
.msg-row.visitor { flex-direction: row-reverse; }
.msg-ava {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--card); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
  box-shadow: 0 2px 8px rgba(30,60,120,.10), inset 0 0 0 1px var(--line);
  overflow: hidden;
}
.msg-ava img { width: 100%; height: 100%; object-fit: cover; }
.msg-box { max-width: 74%; }
.msg-bubble {
  padding: 10px 13px; border-radius: 16px; font-size: 15px;
  line-height: 1.6; word-break: break-word; white-space: pre-wrap;
}
.msg-row.agent .msg-bubble {
  background: var(--card); color: var(--ink);
  border-top-left-radius: 5px;
  box-shadow: 0 2px 8px rgba(30,60,120,.06), inset 0 0 0 1px var(--line);
}
.msg-row.visitor .msg-bubble {
  background: var(--theme-grad); color: #fff;
  border-top-right-radius: 5px;
  box-shadow: 0 4px 12px rgba(22,119,255,.25);
}
.msg-bubble img { max-width: 100%; max-height: 260px; border-radius: 10px; display: block; margin-top: 4px; cursor: zoom-in; }
.msg-bubble audio { width: 100%; max-width: 210px; margin-top: 4px; }
.msg-time { font-size: 10.5px; color: var(--ink-3); margin-top: 5px; padding: 0 3px; }
.msg-row.visitor .msg-time { text-align: right; }

/* ================= 输入区 ================= */
.v-footer-wrap {
  flex-shrink: 0;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -6px 30px rgba(30,60,120,.10);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
}
.v-tool { display: flex; gap: 6px; padding: 0 4px 8px; align-items: center; }
.v-tool-btn {
  background: none; border: none; cursor: pointer; padding: 5px 7px;
  font-size: 12px; color: var(--ink-2); border-radius: 8px;
  display: flex; align-items: center; gap: 5px;
}
.v-tool-btn:active { background: var(--bg); }
.v-tool-btn .ic { font-size: 19px; }
.v-input-row { display: flex; gap: 9px; align-items: flex-end; }
.v-input {
  flex: 1; border: 1.5px solid var(--line); border-radius: 12px;
  padding: 10px 13px; font-size: 15px; outline: none; resize: none;
  max-height: 96px; line-height: 1.5; font-family: inherit;
  background: #f7f9fc; transition: border-color .15s;
}
.v-input:focus { border-color: var(--theme); background: #fff; }
.v-btn {
  background: var(--theme-grad); color: #fff; border: none;
  border-radius: 12px; min-width: 66px; height: 42px; font-size: 15px;
  font-weight: 600; flex-shrink: 0; cursor: pointer;
  box-shadow: 0 4px 12px rgba(22,119,255,.3);
}
.v-btn:disabled { opacity: .45; box-shadow: none; }
.v-btn:active { transform: scale(.97); }

/* 录音条 */
.recording-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 8px; font-size: 14px; color: var(--ink-2);
}
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4d4f; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.rec-time { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.rec-actions { margin-left: auto; display: flex; gap: 8px; }
.rec-cancel { background: #eef1f6; color: var(--ink-2); border: none; border-radius: 10px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
.rec-send { background: var(--theme-grad); color: #fff; border: none; border-radius: 10px; padding: 8px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }

/* ================= 状态页 ================= */
.block-page {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 32px;
  text-align: center; background: var(--bg);
}
.block-card {
  background: var(--card); border-radius: 20px; padding: 38px 30px;
  max-width: 320px; box-shadow: 0 10px 40px rgba(30,60,120,.08);
}
.block-icon { font-size: 52px; margin-bottom: 16px; }
.block-title { font-size: 16.5px; color: var(--ink); font-weight: 700; margin-bottom: 9px; }
.block-desc { font-size: 13.5px; color: var(--ink-2); line-height: 1.75; }
.spinner {
  width: 34px; height: 34px; margin: 0 auto 16px;
  border: 3px solid rgba(22,119,255,.18); border-top-color: var(--theme);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ================= 询前表单 ================= */
.mask {
  position: fixed; inset: 0; background: rgba(15,23,42,.55);
  z-index: 50; display: flex; align-items: center; justify-content: center; padding: 22px;
  backdrop-filter: blur(3px);
}
.form-card {
  background: var(--card); width: 100%; max-width: 380px;
  border-radius: 22px; padding: 28px 24px 24px;
  max-height: 86vh; overflow-y: auto;
  animation: cardIn .28s cubic-bezier(.2,.9,.3,1.2);
  box-shadow: 0 24px 70px rgba(0,0,0,.28);
}
@keyframes cardIn { from { transform: translateY(24px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.form-ava {
  width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 12px;
  background: linear-gradient(135deg, rgba(22,119,255,.12), rgba(22,119,255,.22));
  display: flex; align-items: center; justify-content: center; font-size: 28px;
}
.form-ava img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.form-title { font-size: 16.5px; font-weight: 700; text-align: center; margin-bottom: 4px; color: var(--ink); }
.form-sub { font-size: 12.5px; color: var(--ink-3); text-align: center; margin-bottom: 20px; }
.form-item { margin-bottom: 15px; }
.form-label { font-size: 13px; color: var(--ink-2); margin-bottom: 7px; display: block; font-weight: 500; }
.form-label .req { color: #ff4d4f; margin-left: 2px; }
.form-input {
  width: 100%; border: 1.5px solid var(--line); border-radius: 12px;
  padding: 11px 13px; font-size: 15px; outline: none; font-family: inherit;
  background: #f7f9fc; transition: border-color .15s;
}
.form-input:focus { border-color: var(--theme); background: #fff; }
textarea.form-input { resize: none; min-height: 78px; }
.form-btn {
  width: 100%; margin-top: 10px;
  background: var(--theme-grad); color: #fff; border: none;
  border-radius: 13px; height: 47px; font-size: 16px; font-weight: 600;
  cursor: pointer; box-shadow: 0 6px 16px rgba(22,119,255,.3);
}
.form-btn:disabled { opacity: .6; }
.form-btn:active { transform: scale(.98); }

/* ================= 验证层 ================= */
.verify-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
.verify-card { background: var(--card); border-radius: 20px; padding: 32px 26px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 10px 40px rgba(30,60,120,.08); }
.verify-card.bg { padding: 0; overflow: hidden; background-size: cover; background-position: center; }
.verify-card.bg .verify-inner { background: rgba(255,255,255,.92); margin: 90px 14px 14px; border-radius: 14px; padding: 22px 18px; }
.verify-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
.verify-btn {
  width: 100%; height: 46px; border: none; border-radius: 12px;
  background: var(--theme-grad); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
}
.verify-input {
  width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px;
  font-size: 15px; outline: none; margin-bottom: 12px; text-align: center; letter-spacing: 2px;
}
.verify-code-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.verify-code-img { font-family: Consolas, monospace; font-size: 22px; font-weight: 700; letter-spacing: 5px; font-style: italic;
  background: linear-gradient(90deg,#eef2f7,#e3ecf5); padding: 8px 14px; border-radius: 10px; user-select: none; color: #33445f; }
.slide-track { position: relative; height: 44px; background: #eef1f6; border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
.slide-tip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--ink-3); }
.slide-block {
  position: absolute; top: 3px; left: 3px; width: 38px; height: 38px; border-radius: 10px;
  background: var(--theme-grad); cursor: grab; display: flex; align-items: center; justify-content: center; color: #fff;
}
.slide-ok { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #e8f8ee; color: #00b42a; font-size: 14px; font-weight: 600; }
/* 弹窗公告 */
.pub-mask { position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 24px; }
.pub-card { background: var(--card); border-radius: 18px; max-width: 340px; width: 100%; overflow: hidden; animation: cardIn .25s; }
.pub-head { background: var(--theme-grad); color: #fff; padding: 12px 16px; font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; }
.pub-close { cursor: pointer; opacity: .85; }
.pub-body { padding: 18px 18px 22px; font-size: 14px; line-height: 1.8; color: var(--ink-2); white-space: pre-wrap; max-height: 50vh; overflow-y: auto; }
/* 滚动通知 */
.inform-bar { background: #fffbe6; border-bottom: 1px solid #ffe58f; overflow: hidden; flex-shrink: 0; height: 32px; display: flex; align-items: center; }
.inform-track { white-space: nowrap; display: inline-block; padding-left: 100%; animation: marquee 14s linear infinite; font-size: 12.5px; color: #9a6d1b; }
@keyframes marquee { to { transform: translateX(-100%); } }
/* 底部标识 */
.v-footer-text { text-align: center; font-size: 11px; color: var(--ink-3); padding: 4px 0 6px; background: var(--bg); flex-shrink: 0; }
/* 消息链接 */
.msg-link { color: inherit; text-decoration: underline; cursor: pointer; word-break: break-all; }
.msg-link-copy { display: inline-flex; align-items: center; gap: 3px; background: rgba(0,0,0,.08); border-radius: 6px; padding: 1px 8px; cursor: pointer; font-size: 13px; }
.msg-row.me .msg-link-copy { background: rgba(255,255,255,.2); }
/* VIP 标识 */
.vip-badge { display: inline-block; font-size: 10px; font-weight: 700; color: var(--theme); background: rgba(255,255,255,.85); border: 1px solid var(--theme); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }

/* 图片预览 */
.img-viewer {
  position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 100;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .18s;
}
@keyframes fadeIn { from { opacity: 0; } }
.img-viewer img { max-width: 96vw; max-height: 90vh; border-radius: 6px; }
</style>
</head>
<body>
<div id="app">
  <!-- 不可用 / 加载 -->
  <template v-if="page === 'blocked'">
    <div class="block-page">
      <div class="block-card">
        <div class="block-icon">⚠️</div>
        <div class="block-title">{{ blockedTitle }}</div>
        <div class="block-desc">{{ blockedDesc }}</div>
      </div>
    </div>
  </template>
  <template v-else-if="page === 'loading'">
    <div class="block-page">
      <div class="block-card">
        <div class="spinner"></div>
        <div class="block-title">正在接入</div>
        <div class="block-desc">正在为您连接客服，请稍候…</div>
      </div>
    </div>
  </template>

  <!-- 主界面 -->
  <template v-else>
    <div class="nav-bar" v-if="ui.navOn"><span class="nav-back">‹</span><span class="nav-title">{{ ui.navTitle }}</span><span class="nav-menu">···</span></div>
    <div class="v-header">
      <div class="v-avatar">
        <img v-if="isImg(brand.avatar)" :src="brand.avatar"><template v-else>{{ brand.avatar }}</template>
        <span class="online-dot"></span>
      </div>
      <div style="min-width:0;">
        <div class="v-title">{{ brand.company_name }}<span v-if="brand.vip_badge" class="vip-badge">{{ brand.vip_badge }}</span></div>
        <div class="v-sub">{{ brand.welcome_sub }}</div>
      </div>
      <div class="v-status">{{ onlineText }}</div>
    </div>

    <!-- 滚动通知 -->
    <div class="inform-bar" v-if="brand.inform_on && brand.inform_text">
      <span class="inform-track">📢 {{ brand.inform_text }}</span>
    </div>

    <!-- 公告横幅 -->
    <div class="notice-bar" v-if="brand.notice_on && brand.notice_text">
      <span class="n-ic">📢</span><span>{{ brand.notice_text }}</span>
    </div>

    <div class="v-body" ref="bodyRef">
      <!-- 欢迎屏（暂无消息） -->
      <div class="welcome-card" v-if="!messages.length">
        <div class="w-ava"><img v-if="isImg(brand.avatar)" :src="brand.avatar"><template v-else>{{ brand.avatar }}</template></div>
        <h3>{{ brand.welcome_title }}</h3>
        <p>{{ brand.welcome_sub }}</p>
      </div>

      <div class="msg-row" :class="m.from === 'visitor' ? 'visitor' : 'agent'" v-for="m in visibleMessages" :key="m.id">
        <template v-if="m.recalled">
          <div class="msg-bubble recall-capsule">{{ m.from === 'visitor' ? '你撤回了一条消息' : '对方撤回了一条消息' }}</div>
        </template>
        <template v-else>
          <div class="msg-ava" v-if="m.from === 'visitor'">{{ myAvatar || '🙋' }}</div>
          <div class="msg-ava" v-else>
            <img v-if="isImg(brand.avatar)" :src="brand.avatar"><template v-else>{{ brand.avatar }}</template>
          </div>
          <div class="msg-box">
            <div class="msg-bubble">
              <template v-if="m.text"><template v-for="(seg, si) in linkSegs(m.text)" :key="si"><a v-if="seg.isUrl && linkMode === 'jump'" class="msg-link" :href="seg.t" target="_blank" rel="noopener noreferrer">{{ seg.t }}</a><span v-else-if="seg.isUrl && linkMode === 'copy'" class="msg-link-copy" @click="copyLink(seg.t)">🔗 复制链接</span><template v-else>{{ seg.t }}</template></template></template>
              <template v-for="(a, i) in (m.attachments || [])" :key="i">
                <img v-if="a.type === 'image'" :src="a.url" @click="viewImage(a.url)">
                <audio v-if="a.type === 'audio'" :src="a.url" controls></audio>
              </template>
            </div>
            <div class="msg-time">
              {{ fmtTime(m.time) }}
              <a v-if="m.from === 'visitor' && canRecall(m)" class="recall-link" @click="recallMine(m)">撤回</a>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- 录音条 -->
    <div class="v-footer-wrap" v-if="recording">
      <div class="recording-bar">
        <span class="rec-dot"></span>
        <span>录音中</span>
        <span class="rec-time">{{ recSecs }}s</span>
        <span style="font-size:12px;color:var(--ink-3);">最长 60 秒</span>
        <div class="rec-actions">
          <button class="rec-cancel" @click="stopRec(false)">取消</button>
          <button class="rec-send" @click="stopRec(true)">发送</button>
        </div>
      </div>
    </div>

    <template v-else>
    <div class="v-footer-wrap">
      <div class="v-tool">
        <button class="v-tool-btn" @click="pickImage"><span class="ic">🖼️</span>图片</button>
        <button class="v-tool-btn" @click="startRec"><span class="ic">🎤</span>语音</button>
        <input ref="imgInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none" @change="onImage">
      </div>
      <div class="v-input-row">
        <textarea class="v-input" ref="inputRef" rows="1" v-model="draft"
          @focus="scrollBottom" placeholder="请输入您的问题…"
          @keydown.enter.exact.prevent="send"></textarea>
        <button class="v-btn" :disabled="!draft.trim() || sending" @click="send">发送</button>
      </div>
    </div>
    <div class="v-footer-text" v-if="brand.footer_text">{{ brand.footer_text }}</div>
    </template>

  </template>

  <!-- 验证层 -->
  <template v-if="page === 'verify'">
    <div class="verify-wrap">
      <div class="verify-card" :class="{bg: verifyBg}" :style="verifyBg ? {backgroundImage:'url('+verifyBg+')'} : {}">
        <div class="verify-inner">
          <div class="verify-title">{{ verifyTitle }}</div>
          <template v-if="robotType === 'click'">
            <button class="verify-btn" v-if="!verifyPassed" @click="verifyPassed = true">点击验证</button>
            <div class="slide-ok" v-else>✓ 验证通过，正在进入…</div>
          </template>
          <template v-else-if="robotType === 'slide'">
            <div class="slide-track" v-if="!verifyPassed">
              <div class="slide-tip">按住滑块拖到最右侧</div>
              <div class="slide-block" style="touch-action:none;" @pointerdown="slideStart" @pointermove="slideMove" @pointerup="slideEnd">»</div>
            </div>
            <div class="slide-ok" v-else>✓ 验证通过，正在进入…</div>
          </template>
          <template v-else-if="robotType === 'code'">
            <div class="verify-code-row">
              <span class="verify-code-img">{{ codeText }}</span>
              <span style="cursor:pointer;font-size:16px;" @click="genCode">↻</span>
            </div>
            <input class="verify-input" v-model="codeInput" placeholder="输入图中字符" maxlength="4">
            <button class="verify-btn" @click="codeVerify">验证</button>
          </template>
          <template v-else>
            <input class="verify-input" v-model="verifyValue" :placeholder="robotType === 'invite' ? '请输入邀请码' : '请输入访问密码'" type="password">
            <button class="verify-btn" @click="verifyGo">进入</button>
          </template>
          <div v-if="verifyErr" style="color:#f53f3f;font-size:12.5px;margin-top:10px;">{{ verifyErr }}</div>
        </div>
      </div>
    </div>
  </template>

  <!-- 弹窗公告 -->
  <div class="pub-mask" v-if="pubShow">
    <div class="pub-card">
      <div class="pub-head"><span>{{ pubTitle }}</span><span class="pub-close" @click="pubShow = false">✕</span></div>
      <div class="pub-body">{{ pubContent }}</div>
      <div style="padding:0 18px 18px;"><button class="verify-btn" @click="pubShow = false">我知道了</button></div>
    </div>
  </div>

  <!-- 询前表单 -->
  <div class="mask" v-if="showForm">
    <div class="form-card">
      <div class="form-ava"><img v-if="isImg(brand.avatar)" :src="brand.avatar"><template v-else>{{ brand.avatar }}</template></div>
      <div class="form-title">{{ brand.welcome_title }}</div>
      <div class="form-sub">{{ brand.company_name }} · 在线客服</div>
      <div class="form-item" v-for="f in formItems" :key="f.id">
        <label class="form-label">{{ f.label }}<span class="req" v-if="f.required">*</span></label>
        <input v-if="f.type !== 'textarea'" class="form-input" v-model="formValues[f.key]" :placeholder="f.placeholder">
        <textarea v-else class="form-input" v-model="formValues[f.key]" :placeholder="f.placeholder"></textarea>
      </div>
      <button class="form-btn" :disabled="formSubmitting" @click="submitForm">{{ formSubmitting ? '正在接入…' : '开始咨询' }}</button>
    </div>
  </div>

  <!-- 图片预览 -->
  <div class="img-viewer" v-if="viewing" @click="viewing = ''">
    <img :src="viewing" alt="">
  </div>
</div>

<script src="/assets/vendor/vue.global.js?v=2.0.1"></script>
<script>
const { createApp, ref, reactive, onMounted, onUnmounted, nextTick } = Vue;

createApp({
  setup() {
    const qs = new URLSearchParams(location.search);
    const page = ref('loading');
    const blockedTitle = ref('暂时无法接入');
    const blockedDesc = ref('');
    const brand = reactive({ company_name: '在线客服', welcome_title: '您好，欢迎咨询！', welcome_sub: '', avatar: '💬', theme_color: '#1677ff', pre_inquiry_on: true });
    const messages = ref([]);
    const draft = ref('');
    const sending = ref(false);
    const sessionId = ref(0);
    const maxMsgId = ref(0);
    const visitorToken = ref('');
    const bodyRef = ref(null);
    const inputRef = ref(null);
    const imgInput = ref(null);
    const viewing = ref('');

    // 询前表单
    const showForm = ref(false);
    const formItems = ref([]);
    const formValues = reactive({});
    const formSubmitting = ref(false);

    // 录音
    const recording = ref(false);
    const recSecs = ref(0);
    let mediaRecorder = null, recChunks = [], recTimer = null, recStartAt = 0;

    let pollTimer = null;

    const params = () => {
      const p = {};
      if (qs.get('code')) p.code = qs.get('code');
      if (qs.get('t')) p.t = qs.get('t');
      return p;
    };

    const scrollBottom = () => nextTick(() => { if (bodyRef.value) bodyRef.value.scrollTop = bodyRef.value.scrollHeight; });

    const isImg = (v) => typeof v === 'string' && (v.startsWith('http') || v.startsWith('/uploads'));

    // ===== 19 个平台皮肤模板（对标 kefulogin）=====
    const TEMPLATES = {
      default:      { label: '默认客服', nav: '在线客服',   color: '#1677ff', g1: '#1677ff', g2: '#4d9bff', dark: false },
      weixin:       { label: '微信',     nav: '微信客服',   color: '#07C160', g1: '#07C160', g2: '#2bd576', dark: false },
      alipay:       { label: '支付宝',   nav: '支付宝客服中心', color: '#1677FF', g1: '#1677FF', g2: '#3d8bff', dark: false },
      meituan:      { label: '美团',     nav: '美团外卖·客服中心', color: '#FFC300', g1: '#FFD100', g2: '#FFC300', dark: true },
      jingdong:     { label: '京东',     nav: '京东客服',   color: '#E2231A', g1: '#E93B35', g2: '#E2231A', dark: false },
      pinduoduo:    { label: '拼多多',   nav: '拼多多官方客服', color: '#E02E24', g1: '#FF4A3C', g2: '#E02E24', dark: false },
      douyin:       { label: '抖音',     nav: '抖音客服中心', color: '#161823', g1: '#2a2d36', g2: '#161823', dark: true },
      xianyu:       { label: '闲鱼',     nav: '闲鱼·客服中心', color: '#FFE311', g1: '#FFF04D', g2: '#FFE311', dark: true },
      tmall:        { label: '天猫',     nav: '天猫客服中心', color: '#FF0036', g1: '#FF2E5C', g2: '#FF0036', dark: false },
      taobao:       { label: '淘宝',     nav: '淘宝客服',   color: '#FF5000', g1: '#FF7A1E', g2: '#FF5000', dark: false },
      tencent:      { label: '腾讯客服', nav: '腾讯客服',   color: '#0052D9', g1: '#0052D9', g2: '#3B7FFF', dark: false },
      baitiao:      { label: '京东白条', nav: '白条金融客服', color: '#4A5AFF', g1: '#5C6BFF', g2: '#4A5AFF', dark: false },
      fenqile:      { label: '分期乐',   nav: '分期乐客服', color: '#FF6A00', g1: '#FF8A1E', g2: '#FF6A00', dark: false },
      delivery:     { label: '外卖平台', nav: '外卖平台客服', color: '#00A6FF', g1: '#00BFFF', g2: '#00A6FF', dark: false },
      tongcheng58:  { label: '58同城',   nav: '58同城客服', color: '#FF6E00', g1: '#FF8A1E', g2: '#FF6E00', dark: false },
      weilidai:     { label: '微粒贷',   nav: '微粒贷金融客服', color: '#00B389', g1: '#00D69F', g2: '#00B389', dark: false },
      whatsapp:     { label: 'WhatsApp', nav: 'Customer Service', color: '#25D366', g1: '#25D366', g2: '#1FB857', dark: false },
      worldcup:     { label: '世界杯',   nav: '赛事服务客服', color: '#1B5E20', g1: '#2E7D32', g2: '#1B5E20', dark: false },
      xiaohongshu:  { label: '小红书',   nav: '小红书客服中心', color: '#FF2442', g1: '#FF4A66', g2: '#FF2442', dark: false },
      yangqianguan: { label: '钱罐子',   nav: '钱罐子客服', color: '#FF8800', g1: '#FFAA1E', g2: '#FF8800', dark: false },
    };
    const applyTemplate = (key) => {
      const k = TEMPLATES[key] ? key : 'default';
      const t = TEMPLATES[k];
      document.body.dataset.tpl = k;
      document.documentElement.style.setProperty('--theme', t.color);
      document.documentElement.style.setProperty('--theme-grad', `linear-gradient(135deg, ${t.g1}, ${t.g2})`);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t.color);
      return t;
    };
    const fmtTime = (t) => {
      if (!t) return '';
      const d = new Date(t);
      const pad = (n) => String(n).padStart(2, '0');
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    };

    const applyBrand = (b) => {
      Object.assign(brand, b);
      if (b.theme_color) document.documentElement.style.setProperty('--theme', b.theme_color);
    };

    const storeToken = (t) => {
      visitorToken.value = t;
      const key = 'kfxt_vt_' + (qs.get('code') || qs.get('t') || location.hostname);
      try { localStorage.setItem(key, t); } catch (e) {}
    };
    const loadToken = () => {
      const key = 'kfxt_vt_' + (qs.get('code') || qs.get('t') || location.hostname);
      try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
    };

    // 访客端不显示系统提示（转接/结束等）；欢迎语按客服消息展示
    const visibleMessages = Vue.computed(() => messages.value.filter(m => m.recalled || m.from !== 'system' || m.sender_name === '欢迎语'));
    const canRecall = (m) => m.from === 'visitor' && !m.recalled && m.id > 0 && (Date.now() - new Date(m.time).getTime()) < 120000;
    const recallMine = async (m) => {
      try {
        await fetch('/api/visitor/recall', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId.value, msg_id: m.id }) });
        m.recalled = true; m.text = ''; m.attachments = [];
      } catch (e) { alert('撤回失败：' + e.message); }
    };
    const pushMessages = (list) => {
      let added = false;
      for (const m of (list || [])) {
        if (m.id > maxMsgId.value) {
          maxMsgId.value = m.id;
          messages.value.push(m);
          added = true;
        }
      }
      if (added) scrollBottom();
    };

    // ---- 初始化流程 ----
    const boot = async () => {
      try {
        const p = params();
        if (!p.code && !p.t) {
          // 纯子域名访问也允许（后端按 host 识别）
        }
        const q = new URLSearchParams(p);
        const cfg = await fetch('/api/visitor/config?' + q.toString()).then(r => r.json());
        if (!cfg.available) {
          blockedDesc.value = cfg.unavailable_reason || '该链接已失效';
          page.value = 'blocked';
          return;
        }
        applyBrand(cfg.brand);
        const tplKey = cfg.brand.template || 'default';
        window.__tpl = applyTemplate(tplKey);
        navTitle.value = TEMPLATES[tplKey] ? TEMPLATES[tplKey].nav : '在线客服';
        robotType.value = cfg.brand.robot || 'no';
        linkMode.value = cfg.brand.link_mode || 'no';
        if (!cfg.brand.tpl_nav_on) document.body.dataset.navOff = '1';
        if (cfg.brand.tpl_nav_title) navTitle.value = cfg.brand.tpl_nav_title;
        if (cfg.brand.publicity_on && cfg.brand.publicity_content) {
          const pk = 'kfxt_pub_' + (qs.get('code') || qs.get('t') || 'x');
          let seen = false; try { seen = sessionStorage.getItem(pk) === '1'; } catch (e) {}
          if (!seen) { pubTitle.value = cfg.brand.publicity_title || '公告'; pubContent.value = cfg.brand.publicity_content; pubShow.value = true; try { sessionStorage.setItem(pk, '1'); } catch (e) {} }
        }
        if (cfg.quota_full && cfg.quota_full !== '') {
          blockedDesc.value = '本周客服名额已满，请稍后再来';
          page.value = 'blocked';
          return;
        }

        // 已有会话则直接恢复
        const vt = loadToken();
        if (vt) {
          try {
            const r = await fetch('/api/visitor/init', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...p, visitor_token: vt, from_url: document.referrer || '直接访问' })
            }).then(x => x.json());
            if (r && r.session_id) {
              sessionId.value = r.session_id;
              storeToken(r.visitor_token);
              page.value = 'chat';
              await loadHistory();
              startPoll();
              return;
            }
          } catch (e) { /* 恢复失败走新流程 */ }
        }

        // 询前表单 or 直接入口
        if (cfg.brand.pre_inquiry_on) {
          try {
            const items = await fetch('/api/visitor/pre-inquiry?' + q.toString()).then(r => r.json());
            if (Array.isArray(items) && items.length) {
              formItems.value = items;
              showForm.value = true;
              page.value = 'chat';
              return;
            }
          } catch (e) { /* 拉取失败跳过表单 */ }
        }
        await startSession({});
      } catch (e) {
        const em = String(e.message);
        if (em.includes('验证') || em.includes('邀请码') || em.includes('密码')) {
          verifyErr.value = (em.includes('邀请码') || em.includes('密码')) ? em : '';
          page.value = 'verify';
          if (robotType.value === 'code') genCode();
          return;
        }
        blockedDesc.value = em || '链接无效，请联系客服获取新的链接';
        page.value = 'blocked';
      }
    };

    const startSession = async (extra) => {
      const p = { ...params(), ...extra, from_url: document.referrer || '直接访问' };
      const vt = loadToken();
      if (vt) p.visitor_token = vt;
      if (verifyPassed.value) p.verify_passed = 1;
      if (verifyValue.value.trim()) p.verify_value = verifyValue.value.trim();
      const r = await fetch('/api/visitor/init', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(p)
      }).then(x => { if (!x.ok) return x.json().then(j => { throw new Error(j.error || '接入失败'); }); return x.json(); });
      if (!r.session_id) throw new Error(r.error || '接入失败');
      sessionId.value = r.session_id;
      storeToken(r.visitor_token);
      if (r.visitor_avatar) myAvatar.value = r.visitor_avatar;
      page.value = 'chat';
      await loadHistory();
      // 欢迎语
      try {
        await fetch('/api/visitor/welcome', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId.value, name: extra.name || '' })
        });
      } catch (e) {}
      await pollOnce();
      startPoll();
    };

    const loadHistory = async () => {
      const r = await fetch('/api/visitor/messages?session_id=' + sessionId.value).then(x => x.json());
      pushMessages(r.messages || []);
    };

    const submitForm = async () => {
      for (const f of formItems.value) {
        if (f.required && !(formValues[f.key] || '').trim()) {
          alert('请填写：' + f.label);
          return;
        }
      }
      formSubmitting.value = true;
      try {
        await startSession({
          name: formValues.name || '',
          phone: formValues.phone || '',
          question: formValues.question || '',
        });
        showForm.value = false;
      } catch (e) {
        alert(e.message);
      } finally { formSubmitting.value = false; }
    };

    // ---- 轮询 ----
    const pollOnce = async () => {
      if (!sessionId.value) return;
      try {
        const r = await fetch('/api/poll?session=' + sessionId.value + '&sinceMsg=' + maxMsgId.value).then(x => x.json());
        pushMessages(r.messages || []);
      } catch (e) {}
    };
    const startPoll = () => {
      stopPoll();
      pollTimer = setInterval(pollOnce, 2500);
    };
    const stopPoll = () => { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } };

    // ---- 发送 ----
    const send = async () => {
      const text = draft.value.trim();
      if (!text || sending.value || !sessionId.value) return;
      sending.value = true;
      draft.value = '';
      try {
        const r = await fetch('/api/visitor/send', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId.value, text })
        }).then(x => { if (!x.ok) return x.json().then(j => { throw new Error(j.error); }); return x.json(); });
        if (r.message) { pushMessages([r.message]); }
        if (r.auto_reply) { pushMessages([r.auto_reply]); }
      } catch (e) {
        draft.value = text;
        alert(e.message);
      } finally { sending.value = false; }
    };

    // ---- 图片 ----
    const pickImage = () => imgInput.value && imgInput.value.click();
    const onImage = async (ev) => {
      const file = ev.target.files[0];
      ev.target.value = '';
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { alert('图片不能超过 5MB'); return; }
      const data = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(file); });
      try {
        const up = await fetch('/api/visitor/upload', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId.value, data, kind: 'image', filename: file.name })
        }).then(x => { if (!x.ok) return x.json().then(j => { throw new Error(j.error); }); return x.json(); });
        const r = await fetch('/api/visitor/send', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId.value, text: '', attachments: [up] })
        }).then(x => x.json());
        if (r.message) pushMessages([r.message]);
      } catch (e) { alert(e.message); }
    };

    // ---- 录音 ----
    const startRec = async () => {
      if (!navigator.mediaDevices || !window.MediaRecorder) { alert('当前浏览器不支持录音，请使用文字沟通'); return; }
      try {
        // 优先 mp4（iOS 微信兼容），否则 webm
        let mime = '';
        for (const m of ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']) {
          if (MediaRecorder.isTypeSupported(m)) { mime = m; break; }
        }
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        recChunks = [];
        mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          if (!recSendFlag || !recChunks.length) return;
          const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          if (blob.size > 10 * 1024 * 1024) { alert('语音过长'); return; }
          const data = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
          try {
            const up = await fetch('/api/visitor/upload', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ session_id: sessionId.value, data, kind: 'audio', filename: 'voice.webm' })
            }).then(x => { if (!x.ok) return x.json().then(j => { throw new Error(j.error); }); return x.json(); });
            const r = await fetch('/api/visitor/send', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ session_id: sessionId.value, text: '', attachments: [up] })
            }).then(x => x.json());
            if (r.message) pushMessages([r.message]);
          } catch (e) { alert(e.message); }
        };
        recSendFlag = false;
        mediaRecorder.start();
        recording.value = true;
        recSecs.value = 0;
        recStartAt = Date.now();
        recTimer = setInterval(() => {
          recSecs.value = Math.floor((Date.now() - recStartAt) / 1000);
          if (recSecs.value >= 60) stopRec(true);
        }, 500);
      } catch (e) {
        alert('无法获取麦克风权限，请使用文字沟通');
      }
    };
    let recSendFlag = false;
    const stopRec = (sendIt) => {
      if (!mediaRecorder) return;
      recSendFlag = sendIt;
      clearInterval(recTimer);
      recording.value = false;
      try { mediaRecorder.stop(); } catch (e) {}
    };

    const viewImage = (url) => { viewing.value = url; };

    const onlineText = ref('客服在线');
    const navTitle = ref('在线客服');

    // ===== 验证策略 =====
    const robotType = ref('no');
    const verifyTitle = ref('安全验证');
    const verifyBg = ref('');
    const verifyPassed = ref(false);
    const verifyValue = ref('');
    const verifyErr = ref('');
    const codeText = ref('');
    const codeInput = ref('');
    const genCode = () => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      codeText.value = Array.from({length: 4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
    };
    const codeVerify = () => {
      if (codeInput.value.toUpperCase() === codeText.value.toUpperCase()) { verifyPassed.value = true; verifyErr.value = ''; doEnter(); }
      else { verifyErr.value = '验证码错误'; genCode(); codeInput.value = ''; }
    };
    const verifyGo = async () => {
      if (!verifyValue.value.trim()) { verifyErr.value = '请输入'; return; }
      verifyErr.value = '';
      await doEnter({ verify_value: verifyValue.value.trim() });
    };
    // 滑块
    let slideDragging = false, slideStartX = 0, slideW = 0;
    const slideStart = (e) => { slideDragging = true; slideStartX = e.clientX; slideW = e.target.parentElement.clientWidth - 44; e.target.setPointerCapture(e.pointerId); };
    const slideMove = (e) => {
      if (!slideDragging) return;
      let dx = Math.max(0, Math.min(slideW, e.clientX - slideStartX));
      e.target.style.left = (3 + dx) + 'px';
      if (dx >= slideW - 2) { slideDragging = false; verifyPassed.value = true; doEnter(); }
    };
    const slideEnd = (e) => {
      if (!verifyPassed.value && e.target) e.target.style.left = '3px';
      slideDragging = false;
    };
    // 验证通过后进入（无询前表单直接入口场景）
    const doEnter = async (extra) => {
      try {
        await startSession(extra || {});
        page.value = 'chat';
      } catch (e) {
        verifyErr.value = e.message;
        if (robotType.value === 'code') { genCode(); codeInput.value = ''; }
      }
    };

    // ===== 弹窗公告 =====
    const pubShow = ref(false);
    const pubTitle = ref('');
    const pubContent = ref('');

    // ===== 链接处理 =====
    const linkMode = ref('no');
    const URL_RE = /(https?:\/\/[^\s<>"']+)/g;
    const linkSegs = (text) => {
      const segs = []; let last = 0; let mm;
      URL_RE.lastIndex = 0;
      while ((mm = URL_RE.exec(text)) !== null) {
        if (mm.index > last) segs.push({ t: text.slice(last, mm.index), isUrl: false });
        segs.push({ t: mm[1], isUrl: true });
        last = mm.index + mm[1].length;
      }
      if (last < text.length) segs.push({ t: text.slice(last), isUrl: false });
      return segs;
    };
    const copyLink = (url) => { navigator.clipboard && navigator.clipboard.writeText(url); alert('链接已复制，请在浏览器中打开'); };

    // ===== 访客自己头像 =====
    const myAvatar = ref('');
    const myName = ref('');
    const ui = Vue.computed(() => ({
      navOn: document.body.dataset.navOff !== '1',
      navTitle: navTitle.value,
    }));

    onMounted(boot);
    onUnmounted(stopPoll);

    return {
      page, blockedTitle, blockedDesc, brand, messages, draft, sending,
      bodyRef, inputRef, imgInput, viewing, viewImage,
      showForm, formItems, formValues, formSubmitting, submitForm,
      recording, recSecs, startRec, stopRec,
      send, pickImage, onImage, fmtTime, scrollBottom, onlineText, isImg, visibleMessages, navTitle, canRecall, recallMine,
      ui, robotType, verifyTitle, verifyBg, verifyPassed, verifyValue, verifyErr, codeText, codeInput,
      genCode, codeVerify, verifyGo, slideStart, slideMove, slideEnd, doEnter,
      pubShow, pubTitle, pubContent, linkMode, linkSegs, copyLink, myAvatar,
    };
  }
}).mount('#app');
