<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平台管理 - 客服系统</title>
<link rel="stylesheet" href="/assets/vendor/element-plus.css">
<link rel="stylesheet" href="/assets/css/admin.css?v=2.1.0">
<script src="/assets/ui/ui-registry.js?v=2.5.1"></script>
<script src="/assets/ui/ui-loader.js?v=2.5.1" data-ui-cat="pc"></script>
</head>
<body>
<div id="app" v-cloak>
  <div v-if="!booted" style="height:100vh;display:flex;align-items:center;justify-content:center;color:#86909c;font-size:14px;">
    ⏳ 正在验证登录...
  </div>
  <div class="layout" v-else>
    <div class="side">
      <div class="logo">🛡️ 平台管理</div>
      <div class="nav">
        <div class="nav-item" :class="{active: tab==='overview'}" @click="tab='overview'">📊 概览</div>
        <div class="nav-item" :class="{active: tab==='tenants'}" @click="tab='tenants'">👥 租户管理</div>
        <div class="nav-item" :class="{active: tab==='domains'}" @click="tab='domains'">🌐 域名池</div>
        <div class="nav-item" :class="{active: tab==='settings'}" @click="tab='settings'">⚙️ 全局设置</div>
      </div>
      <div class="foot" @click="logout">退出登录</div>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="title">{{ tabTitle }}</div>
        <div>
          <el-alert v-if="me && me.default_password" type="warning" :closable="false" style="display:inline-block;padding:4px 12px;margin-right:12px;">
            当前使用默认密码，请尽快在「全局设置」中修改
          </el-alert>
          <span style="color:#4e5969;font-size:13px;">{{ me ? me.nickname : '' }}</span>
        </div>
      </div>

      <div class="content">
        <!-- ===================== 概览 ===================== -->
        <template v-if="tab==='overview' && ov">
          <div class="stat-grid">
            <div class="stat-card"><div class="v">{{ ov.tenants_total }}</div><div class="l">租户总数</div></div>
            <div class="stat-card"><div class="v" style="color:#00b42a;">{{ ov.tenants_active }}</div><div class="l">有效租户</div></div>
            <div class="stat-card"><div class="v" style="color:#f53f3f;">{{ ov.tenants_expired }}</div><div class="l">已到期</div></div>
            <div class="stat-card"><div class="v">{{ ov.agents_total }}</div><div class="l">子客服数</div></div>
            <div class="stat-card"><div class="v">{{ ov.sessions_total }}</div><div class="l">总会话数</div></div>
            <div class="stat-card"><div class="v">{{ ov.sessions_today }}</div><div class="l">今日新会话</div></div>
            <div class="stat-card"><div class="v">{{ ov.messages_today }}</div><div class="l">今日消息数</div></div>
          </div>
          <div class="panel">
            <div class="panel-title">近 7 天新会话</div>
            <div class="bar-row" v-for="d in ov.trend7" :key="d.date">
              <div class="name" style="width:50px;">{{ d.date }}</div>
              <div class="bar"><div :style="{width: barWidth(d.count, ov.trend7)}"></div></div>
              <div class="num">{{ d.count }}</div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-title">租户活跃排行（近 7 天会话数）</div>
            <div class="bar-row" v-if="!ov.ranking.length"><div class="name">暂无数据</div></div>
            <div class="bar-row" v-for="r in ov.ranking" :key="r.id">
              <div class="name mono">{{ r.kami }}（{{ r.nickname }}）</div>
              <div class="bar"><div :style="{width: barWidth(r.c, ov.ranking)}"></div></div>
              <div class="num">{{ r.c }}</div>
            </div>
          </div>
        </template>

        <!-- ===================== 租户管理 ===================== -->
        <template v-if="tab==='tenants'">
          <div class="panel">
            <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;">
              <span>租户列表（{{ tenants.length }}）</span>
              <span>
                <el-button size="small" @click="openGen">随机生成卡密</el-button>
                <el-button type="primary" size="small" @click="openCreate">＋ 创建租户</el-button>
              </span>
            </div>
            <el-table :data="tenants" size="default" stripe>
              <el-table-column label="卡密" width="130">
                <template #default="{row}"><span class="mono" style="font-weight:600;">{{ row.kami }}</span></template>
              </el-table-column>
              <el-table-column prop="nickname" label="名称" width="110"/>
              <el-table-column label="状态" width="90">
                <template #default="{row}">
                  <el-tag v-if="row.status!=='active'" type="danger" size="small">已停用</el-tag>
                  <el-tag v-else-if="row.expired" type="warning" size="small">已到期</el-tag>
                  <el-tag v-else type="success" size="small">正常</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="有效期至" width="150">
                <template #default="{row}">
                  <span v-if="row.expires_at" :style="row.expired?'color:#f53f3f':''">{{ row.expires_at.slice(0,16) }}</span>
                  <span v-else style="color:#86909c;">永久</span>
                </template>
              </el-table-column>
              <el-table-column label="周额度 (网页/客服码)" width="160">
                <template #default="{row}">{{ row.quota_web }} / {{ row.quota_app }}</template>
              </el-table-column>
              <el-table-column prop="max_agents" label="子客服上限" width="90"/>
              <el-table-column prop="agents_cnt" label="子客服" width="70"/>
              <el-table-column prop="sessions" label="会话数" width="75"/>
              <el-table-column prop="last_login_at" label="最后登录" width="150">
                <template #default="{row}"><span style="font-size:12px;color:#86909c;">{{ row.last_login_at ? row.last_login_at.slice(0,16) : '从未' }}</span></template>
              </el-table-column>
              <el-table-column label="备注" prop="remark" min-width="100" show-overflow-tooltip/>
              <el-table-column label="操作" width="200" fixed="right">
                <template #default="{row}">
                  <el-button size="small" @click="openEdit(row)">编辑</el-button>
                  <el-button size="small" :type="row.status==='active' ? 'warning' : 'success'" @click="toggleTenant(row)">
                    {{ row.status==='active' ? '停用' : '启用' }}
                  </el-button>
                  <el-popconfirm title="删除租户及其全部数据，不可恢复？" @confirm="delTenant(row)">
                    <template #reference><el-button size="small" type="danger">删除</el-button></template>
                  </el-popconfirm>
                </template>
              </el-table-column>
            </el-table>
          </div>
        </template>

        <!-- ===================== 域名池 ===================== -->
        <template v-if="tab==='domains'">
          <div class="panel">
            <div class="panel-title">客服码域名池</div>
            <p style="font-size:13px;color:#86909c;margin:0 0 14px;">
              租户「一键换码」时从该池随机取域名生成客服码链接。泛解析域名（*.abc.com）可自动生成随机子域。
            </p>
            <div style="display:flex;gap:10px;margin-bottom:14px;">
              <el-input v-model="newDomain" placeholder="例如 abc.com 或 *.abc.com" style="max-width:320px;" @keyup.enter="addDomain"/>
              <el-button type="primary" @click="addDomain">添加</el-button>
            </div>
            <el-table :data="domains" stripe>
              <el-table-column prop="domain" label="域名"/>
              <el-table-column label="类型" width="110">
                <template #default="{row}">{{ row.wildcard ? '泛解析' : '单域名' }}</template>
              </el-table-column>
              <el-table-column label="状态" width="90">
                <template #default="{row}">
                  <el-tag :type="row.enabled ? 'success' : 'info'" size="small">{{ row.enabled ? '启用' : '停用' }}</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="操作" width="160">
                <template #default="{row}">
                  <el-button size="small" @click="toggleDomain(row)">{{ row.enabled ? '停用' : '启用' }}</el-button>
                  <el-popconfirm title="删除该域名？" @confirm="delDomain(row)">
                    <template #reference><el-button size="small" type="danger">删除</el-button></template>
                  </el-popconfirm>
                </template>
              </el-table-column>
            </el-table>
          </div>
        </template>

        <!-- ===================== 全局设置 ===================== -->
        <template v-if="tab==='settings'">
          <div class="panel">
            <div class="panel-title">主域名（专属链接用）</div>
            <p style="font-size:13px;color:#86909c;margin:0 0 14px;">
              租户的「专属链接」形如 https://子域.主域名/visitor.html。需将该主域名做泛解析（*.主域名 → 本服务器）。
            </p>
            <div style="display:flex;gap:10px;max-width:420px;">
              <el-input v-model="rootDomain" placeholder="例如 kfabc.com"/>
              <el-button type="primary" @click="saveRootDomain">保存</el-button>
            </div>
          </div>
          <div class="panel">
            <div class="panel-title">新租户默认额度</div>
            <div style="display:flex;gap:20px;flex-wrap:wrap;max-width:560px;">
              <div style="flex:1;min-width:160px;">
                <div style="font-size:13px;color:#4e5969;margin-bottom:6px;">网页链接周进粉上限</div>
                <el-input-number v-model="defVal.default_quota_web" :min="0" style="width:100%;"/>
              </div>
              <div style="flex:1;min-width:160px;">
                <div style="font-size:13px;color:#4e5769;margin-bottom:6px;">客服码周进粉上限</div>
                <el-input-number v-model="defVal.default_quota_app" :min="0" style="width:100%;"/>
              </div>
              <div style="flex:1;min-width:160px;">
                <div style="font-size:13px;color:#4e5769;margin-bottom:6px;">子客服数量上限</div>
                <el-input-number v-model="defVal.default_max_agents" :min="0" :max="50" style="width:100%;"/>
              </div>
            </div>
            <el-button type="primary" style="margin-top:16px;" @click="saveDefaults">保存默认值</el-button>
          </div>
          <div class="panel">
            <div class="panel-title">修改管理员密码</div>
            <div style="display:flex;gap:10px;max-width:480px;flex-wrap:wrap;">
              <el-input v-model="pwOld" type="password" placeholder="旧密码" style="width:150px;"/>
              <el-input v-model="pwNew" type="password" placeholder="新密码（至少6位）" style="width:180px;"/>
              <el-button type="primary" @click="changePw">修改密码</el-button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- 创建/编辑租户 -->
  <el-dialog v-model="dlgVisible" :title="dlgMode==='create' ? '创建租户' : '编辑租户'" width="480px">
    <el-form label-width="120px">
      <el-form-item label="卡密" v-if="dlgMode==='create'">
        <el-input v-model="dlg.kami" placeholder="留空自动生成">
          <template #append><el-button @click="fillGenKami">生成</el-button></template>
        </el-input>
      </el-form-item>
      <el-form-item label="卡密" v-else><span class="mono" style="font-weight:600;">{{ dlg.kami }}</span></el-form-item>
      <el-form-item label="名称"><el-input v-model="dlg.nickname" placeholder="例如：张三的客服"/></el-form-item>
      <el-form-item label="有效期">
        <el-date-picker v-model="dlg.expires_at" type="datetime" placeholder="留空为永久"
          value-format="YYYY-MM-DD HH:mm:ss" style="width:100%;"/>
      </el-form-item>
      <el-form-item label="网页周额度"><el-input-number v-model="dlg.quota_web" :min="0"/></el-form-item>
      <el-form-item label="客服码周额度"><el-input-number v-model="dlg.quota_app" :min="0"/></el-form-item>
      <el-form-item label="子客服上限"><el-input-number v-model="dlg.max_agents" :min="0" :max="50"/></el-form-item>
      <el-form-item label="备注"><el-input v-model="dlg.remark" placeholder="购买渠道 / 联系方式等"/></el-form-item>
      <el-form-item label="重置密码" v-if="dlgMode==='edit'">
        <el-input v-model="dlg.password" placeholder="留空不修改"/>
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="dlgVisible=false">取消</el-button>
      <el-button type="primary" :loading="dlgSaving" @click="saveTenant">{{ dlgMode==='create' ? '创建' : '保存' }}</el-button>
    </template>
  </el-dialog>

  <!-- 创建成功展示卡密 -->
  <el-dialog v-model="createdVisible" title="✅ 租户已创建" width="420px">
    <p style="font-size:14px;color:#4e5969;margin:0 0 12px;">请将以下账号信息发送给客户（密码仅本次展示）：</p>
    <div style="background:#f7f8fa;border-radius:8px;padding:16px;font-size:16px;line-height:2;">
      卡密：<b class="mono">{{ created.kami }}</b><br>
      密码：<b class="mono">{{ created.password }}</b><br>
      登录地址：<span class="mono" style="font-size:13px;">{{ locationOrigin }}/login.html</span>
    </div>
    <template #footer>
      <el-button @click="copyCreated">复制</el-button>
      <el-button type="primary" @click="createdVisible=false">我已保存</el-button>
    </template>
  </el-dialog>

  <!-- 随机生成 -->
  <el-dialog v-model="genVisible" title="随机生成卡密" width="380px">
    <div v-if="genPair" style="background:#f7f8fa;border-radius:8px;padding:14px;font-size:15px;line-height:2;">
      卡密：<b class="mono">{{ genPair.kami }}</b><br>密码：<b class="mono">{{ genPair.password }}</b>
    </div>
    <template #footer>
      <el-button @click="doGen">重新生成</el-button>
      <el-button type="primary" @click="genVisible=false">关闭</el-button>
    </template>
  </el-dialog>
</div>

<script src="/assets/vendor/vue.global.js?v=2.0.1"></script>
<script src="/assets/vendor/element-plus.js?v=2.0.1"></script>
<script src="/assets/api.js?v=2.0.1"></script>
<script src="/assets/js/admin.js?v=2.1.0"></script>
</body>
</html>
