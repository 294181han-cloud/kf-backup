<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>id-0000</title>
<style>
  html,body{height:100%;margin:0;background:#fff;color:#9aa3af;
    font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  body{display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px}
  #tip{max-width:320px}
  #tip a{color:#1677ff;text-decoration:none;border-bottom:1px solid #1677ff}
  .spin{display:inline-block;width:16px;height:16px;margin-right:6px;vertical-align:-3px;
    border:2px solid #e5e6eb;border-top-color:#9aa3af;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<!-- v2.54 默认就显示提示：脚本万一没跑起来也不会是纯白页（用户截图里的白屏就是这个） -->
<div id="tip"><span class="spin"></span>正在进入…</div>
<script>
/* 防红中转「空壳页」(v2.59)
   1. 这个文件里**没有任何业务内容**，标题也只是 id-xxxx（扫到的就是一张白纸）；
   2. 真正的出入靠 ?key= 拿客服码，向 /api/gate 校验；
   3. 校验通过后把真实聊天页抓回来 document.write 进当前文档 ——
      这样地址栏会一直停在 /MM-DD/xxxx.html?key=…，分享/举报都是这个随机路径，
      聊天页本身的地址不会流出去。 */
(function () {
  // 无意义标题：扫描器看到的就是一张普通静态页
  try { document.title = 'id-' + Math.random().toString(36).slice(2, 6); } catch (e) {}

  var tip = document.getElementById('tip');
  var done = false;   // 已经注入真实页 / 已经跳转

  // 兜底直连真实聊天页（地址栏会暴露真实页，但保证访客能进来）
  function goDirect(reason) {
    if (done) return;
    done = true;
    if (!key) { failHtml(reason); return; }
    var u = (window.KF_API_BASE || '') + '/visitor.html?code=' + encodeURIComponent(key);
    location.replace(u);
  }
  function failHtml(msg) {
    if (!tip) return;
    tip.innerHTML = (msg || '页面已失效，请重新扫码进入');
    if (key) tip.innerHTML += '<br><a href="' + (window.KF_API_BASE || '') + '/visitor.html?code=' + encodeURIComponent(key) + '">点这里直接进入</a>';
  }
  function fail(msg) {
    if (done) return;
    done = true;
    failHtml(msg);
  }
  function post(url, data, cb) {
    var x = new XMLHttpRequest();
    x.open('POST', url, true);
    x.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    x.timeout = 8000;
    x.onreadystatechange = function () { if (x.readyState === 4) cb(x); };
    x.send(data);
  }
  function parse(x) { try { return JSON.parse(x.responseText); } catch (e) { return null; } }

  var q = new URLSearchParams(location.search);
  var key = q.get('key') || q.get('k') || '';
  if (!key) { fail(); return; }

  // 看门狗：6 秒还没进正文（接口卡住 / 脚本被拦 / 注入失败）→ 直连真实页
  setTimeout(function () { goDirect(); }, 6000);

  var API_BASE = (window.KF_API_BASE || '');
  post(API_BASE + '/api/gate', 'key=' + encodeURIComponent(key), function (x) {
    var r = parse(x);
    // 接口失败也不再让访客干等：直接直连真实页
    if (!r || !r.ok || !r.url) { goDirect(r && r.msg); return; }

    // 把真实聊天页抓回来，注入客服码后整页写进当前文档
    var y = new XMLHttpRequest();
    y.open('GET', r.url, true);
    y.onreadystatechange = function () {
      if (y.readyState !== 4) return;
      if (y.status !== 200) {
        // 兜底：抓不到就直接跳过去（仍然可用，只是地址栏会变成真实页）
        done = true;
        location.replace(r.url + (r.url.indexOf('?') < 0 ? '?' : '&') + 'code=' + encodeURIComponent(r.code));
        return;
      }
      var html = y.responseText;
      var inject = '<script>window.KF_API_BASE=' + JSON.stringify(API_BASE) + ';window.__KF_CODE__=' + JSON.stringify(r.code) + ';<\/script>';
      if (/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, function (m) { return m + inject; });
      else html = inject + html;
      done = true;
      document.open();
      document.write(html);
      document.close();
      // v2.52 兜底：注入完 3 秒还没挂载（微信旧内核不执行 document.write 进来的脚本、静态资源被缓存污染）
      // 就直接跳真实聊天页 —— 地址栏会变成真实页，但总比访客看到一堆 {{ }} 强
      setTimeout(function () {
        if (window.__KF_MOUNTED__) return;
        location.replace(r.url + (r.url.indexOf('?') < 0 ? '?' : '&') + 'code=' + encodeURIComponent(r.code));
      }, 3000);
    };
    y.send();
  });
})();
</script>
</body>
</html>
