<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 - 小米客服</title>
<link rel="stylesheet" href="/assets/vendor/element-plus.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(165deg, #dfeafb 0%, #c9dbf3 45%, #b3cdec 100%);
  padding: 24px;
}
.login-card {
  width: 100%; max-width: 470px;
  background: #fff; border-radius: 24px;
  padding: 46px 48px 34px;
  box-shadow: 0 24px 70px rgba(43, 90, 160, .18);
}
.brand-row { display: flex; align-items: center; gap: 18px; margin-bottom: 34px; }
.brand-icon {
  width: 72px; height: 72px; border-radius: 20px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 20px rgba(255, 105, 0, .3);
  overflow: hidden;
}
.brand-icon svg { width: 42px; height: 42px; }
.brand-title { font-size: 30px; font-weight: 700; color: #14181f; letter-spacing: .5px; }
.brand-sub { font-size: 15px; color: #98a2b3; margin-top: 6px; }
.f-label { font-size: 15px; color: #333; margin: 0 0 8px; font-weight: 500; }
.f-label .req { color: #f53f3f; margin-right: 2px; }
.f-gap { margin-bottom: 22px; }
.el-input__wrapper { padding: 5px 16px; border-radius: 12px; box-shadow: 0 0 0 1px #dcdfe6 inset; }
.el-input__wrapper.is-focus { box-shadow: 0 0 0 1.5px #2b6fff inset; }
.el-input__inner { height: 38px; font-size: 15px; }
.el-input__prefix .ic, .el-input__suffix .ic { display: inline-flex; align-items: center; color: #98a2b3; }
.el-input__prefix .ic svg, .el-input__suffix .ic svg { width: 18px; height: 18px; display: block; }
.login-btn { width: 100%; height: 50px; font-size: 17px; font-weight: 600; border-radius: 12px; margin-top: 6px; }
.footer { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; color: rgba(74, 105, 150, .55); font-size: 12px; }
@media (max-width: 480px) {
  .login-card { padding: 36px 26px 28px; border-radius: 20px; }
  .brand-title { font-size: 25px; }
  .brand-icon { width: 60px; height: 60px; border-radius: 17px; }
  .brand-icon svg { width: 34px; height: 34px; }
}
</style>
</head>
<body>
<div id="app">
  <div class="login-card">
    <div class="brand-row">
      <div class="brand-icon">
        <img src="/assets/img/mi-logo.svg" alt="小米客服" style="width:100%;height:100%;display:block;border-radius:inherit;">
      </div>
      <div>
        <div class="brand-title">小米客服</div>
        <div class="brand-sub">扫码咨询 · 多端接入客服系统</div>
      </div>
    </div>
    <div class="f-gap">
      <div class="f-label"><span class="req">*</span>卡密</div>
      <el-input v-model="account" size="large" placeholder="请输入登录卡密" clearable @keyup.enter="doLogin">
        <template #prefix><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></span></template>
      </el-input>
    </div>
    <div class="f-gap">
      <div class="f-label"><span class="req">*</span>密码</div>
      <el-input v-model="password" size="large" type="password" placeholder="请输入密码" show-password @keyup.enter="doLogin">
        <template #prefix><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10" width="15" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg></span></template>
      </el-input>
    </div>
    <el-button class="login-btn" type="primary" size="large" :loading="loading" @click="doLogin">登 录</el-button>
  </div>
</div>
<div class="footer">Powered by 客服系统</div>
<script src="/assets/vendor/vue.global.js?v=2.0.1"></script>
<script src="/assets/vendor/element-plus.js?v=2.0.1"></script>
<script src="/assets/api.js?v=2.0.1"></script>
<script>
const { createApp, ref } = Vue;
createApp({
  setup() {
    const account = ref('');
    const password = ref('');
    const loading = ref(false);
    const doLogin = async () => {
      if (!account.value || !password.value) { ElementPlus.ElMessage.warning('请输入账号和密码'); return; }
      loading.value = true;
      try {
        const r = await API.login(account.value.trim(), password.value);
        API.setToken(r.token);
        ElementPlus.ElMessage.success('登录成功');
        setTimeout(() => location.href = r.redirect || '/app.html', 400);
      } catch (e) {
        ElementPlus.ElMessage.error(e.message);
      } finally { loading.value = false; }
    };
    // 已登录直接进工作台（token 失效时工作台会清除并回到本页，不会死循环）
    try { if (localStorage.getItem('kfxt_token')) { location.replace('/app.html'); return; } } catch (e) {}
    return { account, password, loading, doLogin };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
